# Подключение к PostgreSQL.
# ВАЖНО: порт 5433 — как в docker-compose.yaml (ports: "5433:5432").
# Если у вас compose пробрасывает 5432 — поменяйте здесь на 5432.
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate сам создаёт/обновляет таблицы по @Entity.
# Для dev удобно. Для прода — validate + миграции (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Отключаем open-in-view: LAZY-поля не должны дотягиваться в контроллере.
# Мы маппим в DTO внутри @Transactional-сервиса, поэтому LazyInitializationException не будет.
spring.jpa.open-in-view=false