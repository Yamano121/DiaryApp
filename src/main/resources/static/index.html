<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DiaryApp — Вход</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
<div class="auth-card">
    <h1 class="logo">📖 DiaryApp</h1>
    <p class="subtitle">Личный дневник, который живёт только на вашем компьютере</p>

    <form id="authForm" onsubmit="return false">
        <div class="field">
            <input id="login" placeholder="Логин" autocomplete="username" required>
        </div>
        <div class="field">
            <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
        </div>
        <p id="err" class="error"></p>
        <div class="row">
            <button type="button" onclick="Auth.login()">Войти</button>
            <button type="button" class="secondary" onclick="Auth.register()">Регистрация</button>
        </div>
    </form>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    // Если уже залогинен — сразу на главную
    Api.get('/auth/me').then(me => { if (me) location.href = '/app.html'; }).catch(() => {});
</script>
</body>
</html>
