<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DiaryApp — Вход</title>
    <!-- ВАЖНО: путь /css/style.css, так как папка css лежит внутри static -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <h1 class="logo text-center">📖 DiaryApp</h1>
        <p class="muted text-center" style="margin-bottom: 20px;">Войдите в свой личный дневник</p>

        <div class="field">
            <label for="login">Логин</label>
            <input type="text" id="login" placeholder="Ваш логин" autocomplete="username">
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Ваш пароль" autocomplete="current-password">
        </div>

        <!-- Блок для вывода ошибок -->
        <p id="err" class="error-text"></p>

        <div class="auth-actions">
            <button class="btn primary w-full" onclick="Auth.login()">Войти</button>
            <button class="btn secondary w-full" onclick="Auth.register()">Регистрация</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
