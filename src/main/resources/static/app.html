<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DiaryApp</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h2 class="logo">📖 DiaryApp</h2>
        <nav>
            <a href="#" class="nav-link active" data-view="diary">📝 Дневник дня</a>
            <a href="#" class="nav-link" data-view="habits">🔥 Привычки</a>
        </nav>
        <button class="logout" onclick="Auth.logout()">🚪 Выйти</button>
    </aside>

    <main class="main">
        <!-- ================== ДНЕВНИК ================== -->
        <section id="view-diary">
            <header class="view-header">
                <h1>Дневник дня</h1>
                <input type="date" id="date" class="date-picker">
            </header>

            <div class="card">
                <h3>Метрики дня</h3>
                <div class="metrics">
                    <div class="field"><label>Часы сна (0–24)</label><input type="number" id="hoursOfSleep" min="0" max="24" value="8"></div>
                    <div class="field"><label>Качество сна (0–10)</label><input type="number" id="qualityOfSleep" min="0" max="10" value="7"></div>
                    <div class="field"><label>Уровень энергии (0–10)</label><input type="number" id="level" min="0" max="10" value="7"></div>
                    <div class="field"><label>Продуктивность (0–10)</label><input type="number" id="productivity" min="0" max="10" value="7"></div>
                    <div class="field"><label>Оценка дня (0–10)</label><input type="number" id="ratingOfDay" min="0" max="10" value="7"></div>
                </div>
            </div>

            <div class="card">
                <h3>Цель и тайм-лайн</h3>
                <div class="field"><label>Цель дня</label><input id="target" placeholder="Например: дописать главу"></div>
                <div class="metrics" style="grid-template-columns:1fr 1fr">
                    <div class="field"><label>С</label><input type="time" id="startTime" value="09:00"></div>
                    <div class="field"><label>По</label><input type="time" id="endTime" value="18:00"></div>
                </div>
            </div>

            <div class="card">
                <h3>Итоги дня</h3>
                <div class="field">
                    <label>Рефлексия</label>
                    <textarea id="resultOfDay" rows="5" placeholder="Что прошло хорошо, что можно улучшить..."></textarea>
                </div>
            </div>

            <div class="row actions">
                <button onclick="Diary.save()">💾 Сохранить день</button>
                <button class="secondary" onclick="Diary.load()">📂 Загрузить дату</button>
            </div>
        </section>

        <!-- ================== ПРИВЫЧКИ ================== -->
        <section id="view-habits" style="display:none">
            <header class="view-header"><h1>Привычки</h1></header>

            <div class="card">
                <h3>Добавить привычку</h3>
                <div class="row">
                    <input id="habitTitle" placeholder="Например: читать 30 страниц">
                    <button onclick="Habits.add()" style="max-width:160px">Добавить</button>
                </div>
            </div>

            <div class="card">
                <h3>Мои привычки</h3>
                <div class="habit-list" id="habitList">
                    <p class="muted">Пока нет привычек</p>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/diary.js"></script>
<script src="/js/habits.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
